[package]
name = "nuvex-fair-launch"
version = "0.1.0"
description = "Nuvex on-chain capped pro-rata fair launch program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nuvex_fair_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.2", features = ["token", "associated_token"] }
